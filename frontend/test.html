<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Console — Meital Boutique</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Heebo', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-800 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10 shadow-lg">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold mono">🔧 QA Console</span>
      <span class="text-xs bg-amber-400 text-slate-900 font-bold px-2 py-0.5 rounded">DEBUG ONLY</span>
    </div>
    <div class="text-xs text-slate-400">
      <span id="js-env-url" class="mono truncate max-w-[200px]">…</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">

    <!-- Token -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <h2 class="font-bold text-slate-700 mb-3">🔑 Admin Token</h2>
      <div class="flex gap-2">
        <input id="js-token" type="password" placeholder="הזן ADMIN_TOKEN..."
          class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm mono focus:outline-none focus:ring-2 focus:ring-slate-400" />
        <button onclick="saveToken()"
          class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold px-4 py-2 rounded-xl">שמור</button>
      </div>
      <p id="js-token-status" class="text-xs text-slate-400 mt-1.5"></p>
    </section>

    <!-- Health Check -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-slate-700">📡 API Health Check</h2>
        <button onclick="runHealthCheck()"
          class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl">בדוק חיבור</button>
      </div>
      <pre id="js-health-result"
        class="mono text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-500 min-h-[60px]">לחץ "בדוק חיבור" להתחלה</pre>
    </section>

    <!-- Inject Mock Booking -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <h2 class="font-bold text-slate-700 mb-1">💉 הזרקת תור Mock</h2>
      <p class="text-xs text-slate-500 mb-3">הזמנה ישירה ב-API ללא OTP. הסלוט חייב להיות קיים ב-Weekly_Slots עם סטטוס Available.</p>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">שם לקוחה</label>
          <input id="f-name" value="לקוחת טסט QA"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">טלפון</label>
          <input id="f-phone" value="0500000000"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mono focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">שירות</label>
          <select id="f-service"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <option value="gel_classic" data-name="לק ג'ל קלאסי" data-dur="90">לק ג'ל קלאסי (90 דק')</option>
            <option value="gel_feet"    data-name="לק ג'ל רגליים" data-dur="120">לק ג'ל רגליים (120 דק')</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">תאריך</label>
          <input id="f-date" type="date"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">שעה (HH:MM)</label>
          <input id="f-time" value="11:00"
            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mono focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="flex items-end">
          <button onclick="injectBooking()" id="js-inject-btn"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-xl text-sm">
            הזרק תור
          </button>
        </div>
      </div>
      <pre id="js-inject-result"
        class="mono text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-500 min-h-[50px] hidden"></pre>
    </section>

    <!-- Live Bookings -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-slate-700">📋 תורים אחרונים</h2>
        <button onclick="loadBookings()"
          class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-4 py-2 rounded-xl">רענן</button>
      </div>
      <div id="js-bookings-list" class="space-y-2 text-sm text-slate-500 min-h-[60px]">
        לחץ "רענן" לטעינה
      </div>
    </section>

    <!-- Unit Tests -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-slate-700">🧪 Unit Tests (Client-Side)</h2>
        <button onclick="runUnitTests()"
          class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold px-4 py-2 rounded-xl">הרץ בדיקות</button>
      </div>
      <p class="text-xs text-slate-500 mb-3">
        בדיקות JavaScript שרצות בדפדפן — ללא API, ללא Google Sheets.
        מוכיחות שהלוגיקה נכונה לפני כל Deploy.
      </p>
      <div id="js-test-results" class="space-y-1"></div>
      <div id="js-test-summary" class="mt-3 text-sm font-bold hidden"></div>
    </section>

  </main>

<script type="module">
import APP_CONFIG from './config.js';
const API = APP_CONFIG.API_URL;
document.getElementById('js-env-url').textContent = API;

const LS = 'meital_admin_token';
document.getElementById('js-token').value = localStorage.getItem(LS) || '';
function getToken() { return document.getElementById('js-token').value.trim() || localStorage.getItem(LS) || ''; }

window.saveToken = () => {
  const t = document.getElementById('js-token').value.trim();
  if (!t) return;
  localStorage.setItem(LS, t);
  const s = document.getElementById('js-token-status');
  s.textContent = '✅ Token שמור ב-localStorage';
  setTimeout(() => s.textContent = '', 2500);
};

async function apiCall(action, extra = {}) {
  const r = await fetch(API, {
    method: 'POST',
    body: JSON.stringify({ action, token: getToken(), ...extra }),
    headers: { 'Content-Type': 'text/plain' },
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Health Check ──────────────────────────────────────────────────────────
window.runHealthCheck = async () => {
  const el = document.getElementById('js-health-result');
  el.textContent = '⏳ בודק...';
  el.className = el.className.replace(/text-\w+-\d+/g, '') + ' text-slate-500';
  const t0 = Date.now();
  try {
    const data = await apiCall('__ping__');
    const ms = Date.now() - t0;
    el.textContent = '✅ API מגיב — ' + ms + ' ms
' + JSON.stringify(data, null, 2);
    el.className = el.className + ' text-emerald-700';
  } catch (e) {
    const ms = Date.now() - t0;
    el.textContent = '⚠️  ' + e.message + ' — ' + ms + ' ms
(מגיב על שגיאות זה סימן טוב היות GAS פעיל)';
    el.className = el.className + ' text-amber-700';
  }
};

// ── Inject Mock Booking ───────────────────────────────────────────────────
const nextBiz = () => {
  const d = new Date(); d.setDate(d.getDate() + 1);
  while (d.getDay() === 5 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
};
document.getElementById('f-date').value = nextBiz();

window.injectBooking = async () => {
  const btn = document.getElementById('js-inject-btn');
  const res = document.getElementById('js-inject-result');
  const sel = document.getElementById('f-service');
  const opt = sel.options[sel.selectedIndex];
  btn.disabled = true; btn.textContent = '⏳ שולח...';
  res.classList.remove('hidden'); res.textContent = '⏳ שולח בקשה...';
  try {
    const data = await apiCall('createBooking', {
      name:        document.getElementById('f-name').value.trim(),
      phone:       document.getElementById('f-phone').value.trim(),
      service:     sel.value,
      serviceName: opt.dataset.name,
      date:        document.getElementById('f-date').value,
      time:        document.getElementById('f-time').value.trim(),
      duration:    parseInt(opt.dataset.dur, 10),
    });
    res.textContent = (data.success
      ? '✅ תור נוצר!
ID: ' + data.bookingId + '
סטטוס: ' + data.status + '
תאריך: ' + data.date + ' ' + data.time
      : '❌ שגיאה: ' + (data.error || '?'))
      + '

' + JSON.stringify(data, null, 2);
  } catch(e) { res.textContent = '💥 ' + e.message; }
  btn.disabled = false; btn.textContent = 'הזרק תור';
};

// ── Live Bookings ─────────────────────────────────────────────────────────
const S_LBL = { Pending:'ממתין', Approved:'מאושר', Rejected:'נדחה', Cancelled:'בוטל' };
const S_CLS = {
  Pending:'bg-amber-100 text-amber-700', Approved:'bg-emerald-100 text-emerald-700',
  Rejected:'bg-red-100 text-red-600', Cancelled:'bg-slate-100 text-slate-500',
};

window.loadBookings = async () => {
  const el = document.getElementById('js-bookings-list');
  el.innerHTML = '<span class="text-slate-400 text-xs">⏳ טוען...</span>';
  try {
    const data = await apiCall('listBookings');
    if (!data.success) throw new Error(data.error || 'שגיאה');
    const list = (data.bookings || []).slice(0, 15);
    if (!list.length) { el.innerHTML = '<span class="text-slate-400 text-xs">אין הזמנות</span>'; return; }
    el.innerHTML = list.map(b => {
      const cls = S_CLS[b.status] || 'bg-slate-100 text-slate-400';
      const lbl = S_LBL[b.status] || b.status;
      const acts = [];
      if (b.status === 'Pending') {
        acts.push(qBtn(b.id, 'Approved',  '✅ אשר', 'bg-emerald-500 hover:bg-emerald-400 text-white'));
        acts.push(qBtn(b.id, 'Rejected',  '❌ דחה', 'bg-red-400 hover:bg-red-300 text-white'));
      }
      if (b.status === 'Approved')
        acts.push(qBtn(b.id, 'Cancelled', '🚫 בטל', 'bg-slate-200 hover:bg-slate-300 text-slate-700'));
      return '<div class="flex items-center justify-between gap-2 border border-slate-100 rounded-xl px-3 py-2.5 bg-slate-50" data-booking="' + b.id + '">'
        + '<div class="min-w-0"><div class="font-semibold text-slate-800 text-sm truncate">' + esc(b.name) + '</div>'
        + '<div class="text-xs text-slate-500 mono">' + b.date + ' ' + b.time + '</div></div>'
        + '<div class="flex items-center gap-1.5 shrink-0"><span class="text-xs font-bold px-2 py-0.5 rounded-full ' + cls + '">' + lbl + '</span>'
        + acts.join('') + '</div></div>';
    }).join('');
    el.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', qAct));
  } catch(e) { el.innerHTML = '<span class="text-red-500 text-xs">' + esc(e.message) + '</span>'; }
};

function qBtn(id, target, label, cls) {
  return '<button data-action="' + target + '" data-id="' + id
    + '" class="text-xs font-bold px-2 py-1 rounded-lg ' + cls + ' transition-colors">' + label + '</button>';
}
async function qAct(e) {
  const btn = e.currentTarget, id = btn.dataset.id, target = btn.dataset.action;
  const card = btn.closest('[data-booking]');
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  btn.textContent = '...';
  try {
    const d = await apiCall('changeStatus', { bookingId: id, targetStatus: target });
    if (!d.success) throw new Error(d.error);
    loadBookings();
  } catch(err) {
    card.querySelectorAll('button').forEach(b => b.disabled = false);
    alert('שגיאה: ' + err.message);
  }
}

// ── Unit Tests ────────────────────────────────────────────────────────────
const VALID = { Pending:['Approved','Rejected'], Approved:['Cancelled'] };
const canT  = (f, t) => !!(VALID[f] && VALID[f].includes(t));
const normP = raw => {
  if (!raw) return null;
  const d = String(raw).replace(/\D/g,'');
  if (d.length===10 && d.startsWith('0'))  return '+972'+d.slice(1);
  if ((d.length===12||d.length===11) && d.startsWith('972')) return '+'+d;
  return null;
};
const fmtD = s => s.replace(/-/g,'/');

const SUITES = [
  { name:'מצב סטטוס — State Machine', tests:[
    { l:'Pending → Approved (תקין)',      f:()=>canT('Pending','Approved')===true },
    { l:'Pending → Rejected (תקין)',      f:()=>canT('Pending','Rejected')===true },
    { l:'Approved → Cancelled (תקין)',    f:()=>canT('Approved','Cancelled')===true },
    { l:'Pending → Cancelled (לא חוקי)',   f:()=>canT('Pending','Cancelled')===false },
    { l:'Approved → Rejected (לא חוקי)',   f:()=>canT('Approved','Rejected')===false },
    { l:'Cancelled → Approved (לא חוקי)', f:()=>canT('Cancelled','Approved')===false },
    { l:'undefined → Approved (לא חוקי)', f:()=>canT(undefined,'Approved')===false },
  ]},
  { name:'נירמול טלפון — Phone Normalization', tests:[
    { l:'05X → E.164',                f:()=>normP('0521234567')==='+972521234567' },
    { l:'E.164 נשמר כמו שהוא', f:()=>normP('+972521234567')==='+972521234567' },
    { l:'טלפון Mock 0500000000', f:()=>normP('0500000000')==='+972500000000' },
    { l:'ריק → null',              f:()=>normP('')===null },
    { l:'3 ספרות → null', f:()=>normP('123')===null },
  ]},
  { name:'עיצוב תאריך — Date Format', tests:[
    { l:'YYYY-MM-DD → YYYY/MM/DD', f:()=>fmtD('2026-05-17')==='2026/05/17' },
    { l:'כר סלש YYYY/MM/DD נשמר', f:()=>fmtD('2026/01/01')==='2026/01/01' },
  ]},
  { name:'לוגיקת פילטר — Dashboard Filters', tests:[
    { l:'היסטוריה = Rejected+Cancelled בלבד', f:()=>{
        const bks=[{status:'Pending'},{status:'Approved'},{status:'Rejected'},{status:'Cancelled'}];
        const h=bks.filter(b=>['Rejected','Cancelled'].includes(b.status));
        return h.length===2 && h.every(b=>['Rejected','Cancelled'].includes(b.status));
    }},
    { l:'פעילים = Pending+Approved בלבד', f:()=>{
        const bks=[{status:'Pending'},{status:'Approved'},{status:'Rejected'},{status:'Cancelled'}];
        return bks.filter(b=>['Pending','Approved'].includes(b.status)).length===2;
    }},
  ]},
];

window.runUnitTests = () => {
  const cont = document.getElementById('js-test-results');
  const summ = document.getElementById('js-test-summary');
  cont.innerHTML = ''; let passed=0, failed=0;
  SUITES.forEach(suite => {
    const hdr = document.createElement('div');
    hdr.className = 'text-xs font-bold text-slate-400 uppercase tracking-wider mt-3 mb-1 border-b border-slate-100 pb-1';
    hdr.textContent = suite.name; cont.appendChild(hdr);
    suite.tests.forEach(t => {
      let ok=false, err='';
      try { ok=t.f(); } catch(e) { err=e.message; }
      ok?passed++:failed++;
      const row=document.createElement('div');
      row.className='flex items-center gap-2 text-xs py-0.5';
      row.innerHTML='<span class="shrink-0 font-bold px-2 py-0.5 rounded mono '
        +(ok?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700')+'">'
        +(ok?'PASS':'FAIL')+'</span>'
        +'<span class="'+(ok?'text-slate-700':'text-red-700 font-semibold')+'">'+esc(t.l)+'</span>'
        +(err?'<span class="text-red-400 mono mono">('+esc(err)+')</span>':'');
      cont.appendChild(row);
    });
  });
  summ.classList.remove('hidden');
  summ.textContent = passed + ' עברו, ' + failed + ' נכשלו';
  summ.className = 'mt-3 text-sm font-bold ' + (failed===0?'text-emerald-700':'text-red-600');
};
</script>
</body>
</html>

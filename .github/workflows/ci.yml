# CI pipeline — runs on every Pull Request targeting main.
# Static asset validation + deploy-drift guard (test suites were removed 2026-08-03).
#
# To enforce this in GitHub:
#   Settings → Branches → Add rule for "main"
#   ✅ Require status checks to pass before merging
#   Add: "static-assets" and "deploy-drift" as required checks
#   ✅ Require branches to be up to date before merging

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['main', 'feat-*']
  workflow_dispatch:  # allow manual trigger from GitHub UI  

# Cancel any in-progress run for the same PR or branch when a new push arrives.
# Prevents stacking of parallel CI runs on a single feature branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 0: Static asset validity ──────────────────────────────────────────
  # sitemap.xml shipped broken on 2026-08-03: a Git-Bash invocation rewrote the
  # closing </urlset> into "<C:/Program Files/Git/urlset>" (MSYS path mangling),
  # which made the file unparseable. Google reported "Sitemap could not be read"
  # and every URL plus all 23 image entries were discarded. Nothing in CI looked
  # at these files, so it reached production silently. Cheap job, runs first.
  static-assets:
    name: Static Assets (XML/JSON)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sitemap.xml is well-formed
        run: python -c "import xml.dom.minidom; xml.dom.minidom.parse('frontend/public/sitemap.xml'); print('sitemap.xml OK')"

      - name: Guard against MSYS path mangling
        run: |
          if grep -rn "C:/Program Files/Git" frontend/public/ frontend/*.html; then
            echo "::error::A Git-Bash path leaked into a shipped asset (MSYS argument conversion)."
            exit 1
          fi
          echo "no mangled paths"

      - name: Validate shipped JSON
        run: |
          for f in frontend/public/manifest.json frontend/service-library.json config/studio.json; do
            [ -f "$f" ] || continue
            python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8')); print(sys.argv[1] + ' OK')" "$f"
          done

  # ─── Job 4: Deploy Drift Guard ─────────────────────────────────────────────
  # Catches the 2026-05-30 class of bug: an Edge Function whose code is committed
  # but never deployed (push != deploy). Compares each function's last git commit
  # against the live `supabase functions list`. Self-skips when the project token
  # is not configured, so forks / contributors without it are never blocked.
  #
  # Skipped on push to main — deploy-functions.yml handles deploy + verify there
  # in sequence (no race condition). This guard runs on PRs and feature pushes only.
  #
  # To enable: add repo secret SUPABASE_ACCESS_TOKEN (Account → Access Tokens).
  deploy-drift:
    name: Deploy Drift Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — per-file commit times must be accurate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0   # pinned — "latest" hits GitHub's API and flakes with "rate limit exceeded"

      - name: Install dependencies
        run: npm install

      - name: Verify Edge Functions are deployed (no drift)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: callmnxlcganwugxwiym
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping deploy-drift check."
            echo "Add it under Settings → Secrets and variables → Actions to enable this guard."
            exit 0
          fi
          npm run verify:deploy


# CI pipeline — runs on every Pull Request targeting main.
# Both jobs must pass for the merge to be unblocked.
#
# To enforce this in GitHub:
#   Settings → Branches → Add rule for "main"
#   ✅ Require status checks to pass before merging
#   Add: "unit-tests" and "e2e-tests" as required checks
#   ✅ Require branches to be up to date before merging

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['main', 'feat-*']  

# Cancel any in-progress run for the same PR or branch when a new push arrives.
# Prevents stacking of parallel CI runs on a single feature branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Unit Tests ─────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit
        continue-on-error: true
        id: unit-run

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: test-results/vitest-results.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Fail if unit tests failed
        if: steps.unit-run.outcome == 'failure'
        run: exit 1

  # ─── Job 2: E2E Tests ──────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # When red, print the agent-readable failure summary straight into the CI
      # log so the cause (error + browser console + network) is visible without
      # downloading anything. Screenshots still live in the uploaded artifacts.
      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f test-results/CLAUDE-FAILURES.md ]; then
            echo "::group::E2E failure diagnostics (test-results/CLAUDE-FAILURES.md)"
            cat test-results/CLAUDE-FAILURES.md
            echo "::endgroup::"
          else
            echo "No CLAUDE-FAILURES.md was produced."
          fi

      # HTML report (always — green runs are inspectable too). The report embeds
      # screenshots under playwright-report/data/, so this single artifact is
      # enough to SEE the failing UI after downloading and opening index.html.
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Raw artifacts: screenshots, traces (.zip), videos, and CLAUDE-FAILURES.md.
      # Upload only on failure to save storage; that is exactly when they matter.
      - name: Upload Playwright test-results (screenshots, traces, videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 3: Backend Tests ──────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Vitest + Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0   # pinned — "latest" hits GitHub's API and flakes with "rate limit exceeded"

      - name: Start local Supabase (applies migrations automatically)
        run: supabase start

      - name: Export DATABASE_URL for backend tests
        run: echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm run test:backend

  # ─── Job 3b: Edge Tests (Deno) ─────────────────────────────────────────────
  # Resilience / fault-injection suite for the WhatsApp channel. No network at
  # runtime: Supabase + Anthropic are mocked inside the tests, so a test that
  # tries to reach the network simply fails (proving isolation).
  edge-tests:
    name: Edge Tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run WhatsApp resilience suite
        # The only npm imports in scope are TYPE-ONLY (erased at runtime), so:
        #   --no-check          : skip type resolution of npm types
        #   --node-modules-dir=none : ignore the repo package.json, use Deno's cache
        # Together they let the suite run as pure Deno (no node_modules needed).
        run: deno test --no-check --node-modules-dir=none --allow-env supabase/functions/_tests/

  # ─── Job 4: Deploy Drift Guard ─────────────────────────────────────────────
  # Catches the 2026-05-30 class of bug: an Edge Function whose code is committed
  # but never deployed (push != deploy). Compares each function's last git commit
  # against the live `supabase functions list`. Self-skips when the project token
  # is not configured, so forks / contributors without it are never blocked.
  #
  # Skipped on push to main — deploy-functions.yml handles deploy + verify there
  # in sequence (no race condition). This guard runs on PRs and feature pushes only.
  #
  # To enable: add repo secret SUPABASE_ACCESS_TOKEN (Account → Access Tokens).
  deploy-drift:
    name: Deploy Drift Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — per-file commit times must be accurate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0   # pinned — "latest" hits GitHub's API and flakes with "rate limit exceeded"

      - name: Install dependencies
        run: npm install

      - name: Verify Edge Functions are deployed (no drift)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: callmnxlcganwugxwiym
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping deploy-drift check."
            echo "Add it under Settings → Secrets and variables → Actions to enable this guard."
            exit 0
          fi
          npm run verify:deploy

  # ─── Job 5: AI Test Healer ─────────────────────────────────────────────────
  # Triggers only on feature branches when tests fail (never on main).
  # Reads CLAUDE-FAILURES.md (E2E) + vitest-results.json (unit), calls Claude
  # to classify and group failures, applies patches, commits and pushes fixes.
  # Skips automatically if the last commit was already a healer commit (loop guard).
  ai-heal:
    name: AI Test Healer
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: |
      failure() &&
      github.ref != 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout branch (with push access)
        uses: actions/checkout@v4
        with:
          ref:        ${{ github.head_ref || github.ref_name }}
          token:      ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install healer dependencies
        run: pip install anthropic

      - name: Download E2E failure report
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
        continue-on-error: true   # E2E artifact only exists when E2E job failed

      - name: Download unit test results
        uses: actions/download-artifact@v4
        with:
          name: vitest-results
          path: test-results/
        continue-on-error: true   # unit artifact only exists when unit job ran in CI

      - name: Ensure GH labels exist
        run: |
          gh label create "auto-heal"         --color "e4e669" --description "Created by AI Test Healer" 2>/dev/null || true
          gh label create "needs-manual-fix"  --color "d93f0b" --description "Healer skipped — fix manually" 2>/dev/null || true
          gh label create "flaky-test"        --color "0075ca" --description "Intermittent test failure" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run AI healer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/ai_healer.py

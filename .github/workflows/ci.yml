# CI pipeline — runs on every Pull Request targeting main.
# Both jobs must pass for the merge to be unblocked.
#
# To enforce this in GitHub:
#   Settings → Branches → Add rule for "main"
#   ✅ Require status checks to pass before merging
#   Add: "unit-tests" and "e2e-tests" as required checks
#   ✅ Require branches to be up to date before merging

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['main', 'feat-*']  

jobs:
  # ─── Job 1: Unit Tests ─────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

  # ─── Job 2: E2E Tests ──────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # When red, print the agent-readable failure summary straight into the CI
      # log so the cause (error + browser console + network) is visible without
      # downloading anything. Screenshots still live in the uploaded artifacts.
      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f test-results/CLAUDE-FAILURES.md ]; then
            echo "::group::E2E failure diagnostics (test-results/CLAUDE-FAILURES.md)"
            cat test-results/CLAUDE-FAILURES.md
            echo "::endgroup::"
          else
            echo "No CLAUDE-FAILURES.md was produced."
          fi

      # HTML report (always — green runs are inspectable too). The report embeds
      # screenshots under playwright-report/data/, so this single artifact is
      # enough to SEE the failing UI after downloading and opening index.html.
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Raw artifacts: screenshots, traces (.zip), videos, and CLAUDE-FAILURES.md.
      # Upload only on failure to save storage; that is exactly when they matter.
      - name: Upload Playwright test-results (screenshots, traces, videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 3: Backend Tests ──────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Vitest + Supabase)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations automatically)
        run: supabase start

      - name: Export DATABASE_URL for backend tests
        run: echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm run test:backend

  # ─── Job 4: Deploy Drift Guard ─────────────────────────────────────────────
  # Catches the 2026-05-30 class of bug: an Edge Function whose code is committed
  # but never deployed (push != deploy). Compares each function's last git commit
  # against the live `supabase functions list`. Self-skips when the project token
  # is not configured, so forks / contributors without it are never blocked.
  #
  # To enable: add repo secret SUPABASE_ACCESS_TOKEN (Account → Access Tokens).
  deploy-drift:
    name: Deploy Drift Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — per-file commit times must be accurate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm install

      - name: Verify Edge Functions are deployed (no drift)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: callmnxlcganwugxwiym
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping deploy-drift check."
            echo "Add it under Settings → Secrets and variables → Actions to enable this guard."
            exit 0
          fi
          npm run verify:deploy

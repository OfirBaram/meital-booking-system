# Auto-deploy Supabase Edge Functions on every merge to main.
#
# Triggers only when files under supabase/functions/ change, so a
# frontend-only commit never touches Supabase.
#
# Requires one repo secret:
#   SUPABASE_ACCESS_TOKEN  — Account → Access Tokens on supabase.com
#   (same token already used by the deploy-drift guard in ci.yml)
#
# What it does:
#   1. Deploy all Edge Functions (same logic as scripts/deploy-functions.sh)
#   2. Run verify:deploy to confirm no drift remains
#   3. Post a summary to the GitHub Actions log

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed by verify:deploy commit-time checks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0   # pinned — "latest" flakes with GitHub rate-limit errors

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            echo "Add it under: Settings → Secrets and variables → Actions"
            exit 1
          fi

          PROJECT_REF="callmnxlcganwugxwiym"

          # Discover every deployable function (directory with index.ts, skip _shared)
          FUNCS=()
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            [ "$name" = "_shared" ] && continue
            [ -f "${d}index.ts" ] && FUNCS+=("$name")
          done

          echo "▶ Deploying ${#FUNCS[@]} functions: ${FUNCS[*]}"
          for f in "${FUNCS[@]}"; do
            echo "▶ Deploying $f …"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
          done
          echo "✅ All functions deployed."

      - name: Verify no deploy drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: callmnxlcganwugxwiym
        run: npm run verify:deploy

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Edge Functions deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All functions under \`supabase/functions/\` are live and in sync." >> $GITHUB_STEP_SUMMARY
